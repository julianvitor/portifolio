<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Página não encontrada | Julian Carreiro</title>

    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>

    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="theme.js" defer></script>
    <script src="oneko.js" defer></script>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Cantarell, Noto Sans, sans-serif;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-neutral-100 text-neutral-900 dark:bg-neutral-900 dark:text-neutral-100 antialiased flex flex-col justify-center items-center px-4"
  >
    <div class="max-w-md w-full text-center py-12">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-neutral-200 dark:bg-neutral-800 text-2xl font-bold mb-6">
        404
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight">Página não encontrada</h1>
      <p class="mt-3 text-neutral-600 dark:text-neutral-400">
        O link que você tentou acessar não existe ou foi movido.
      </p>
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
        <a
          href="index.html"
          class="w-full sm:w-auto inline-flex items-center justify-center rounded-full bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-semibold px-6 py-2.5 hover:bg-neutral-800 dark:hover:bg-neutral-200 transition"
        >
          Voltar para o início
        </a>
        <button
          id="theme-toggle"
          type="button"
          class="w-full sm:w-auto inline-flex items-center justify-center rounded-full border border-neutral-300 dark:border-neutral-700 text-sm font-medium px-4 py-2.5 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/50 transition"
        >
          Alternar tema
        </button>
      </div>
    </div>
  </body>
</html>
