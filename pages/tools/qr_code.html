<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="../../assets/icons/favicon.ico" />

    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>

    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../../assets/js/theme.js" defer></script>
    <script src="../../assets/js/oneko.js" defer></script>
    <script src="../../assets/js/qrcode.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
      body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Cantarell, Noto Sans, sans-serif;
      }
      #qrcode-container img, #qrcode-container canvas {
        margin: 0 auto;
        border-radius: 0.5rem;
      }
    </style>

  <body class="min-h-screen bg-gray-100 text-neutral-900 dark:bg-neutral-900 dark:text-neutral-100">
    <button

      class="lg:hidden fixed top-4 left-4 z-50 p-2 rounded-md bg-neutral-200 dark:bg-neutral-800"
    >
      ☰
    </button>
    <div class="min-h-screen flex flex-col lg:flex-row">
      <div
        id="overlay"
        class="fixed inset-0 bg-black/50 hidden lg:hidden z-40"
      ></div>

      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-50 w-56 bg-neutral-50 dark:bg-neutral-950 border-r border-neutral-200 dark:border-neutral-800 h-screen overflow-y-auto -translate-x-full transition-transform duration-200 lg:translate-x-0"
      >
        <div class="p-6">
          <div class="flex items-center gap-3">
            <img
              src="../../assets/images/profile.jpg"
              alt="Avatar"
              class="h-10 w-10 rounded-full object-cover"
            />
            <div class="text-sm">
              <div class="font-semibold">Julian Carreiro</div>
              <div class="text-neutral-500 dark:text-neutral-400">Software & Hardware</div>
            </div>
          </div>

          <nav class="mt-6 space-y-1 text-sm">
            <a
              href="../../index.html"
              class="block rounded-md px-2 py-2 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-500 dark:focus-visible:ring-neutral-400"
              >Início</a
            >
            <a
              href="../../index.html#sobre"
              class="block rounded-md px-2 py-2 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-500 dark:focus-visible:ring-neutral-400"
              >Sobre</a
            >
            <a
              href="../projects.html"
              class="block rounded-md px-2 py-2 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-500 dark:focus-visible:ring-neutral-400"
              >Projetos</a
            >
            <a
              href="../blog.html"
              class="block rounded-md px-2 py-2 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-500 dark:focus-visible:ring-neutral-400"
              >Artigos</a
            >
            <a
              href="../tools.html"
              class="block rounded-md px-2 py-2 bg-neutral-200 dark:bg-neutral-800 text-neutral-900 dark:text-neutral-50 font-semibold shadow-sm"
              >Utilidades</a
            >
            <a
              href="../../index.html#contato"
              class="block rounded-md px-2 py-2 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-500 dark:focus-visible:ring-neutral-400"
              >Contato</a
            >
          </nav>

          <div class="mt-4">
            <button
              id="theme-toggle"
              type="button"
              class="w-full rounded-md px-2 py-2 text-sm font-semibold bg-neutral-200 text-neutral-900 border border-neutral-300/60 dark:bg-neutral-800/60 dark:text-neutral-50 dark:border-neutral-700/60 hover:bg-neutral-300/70 dark:hover:bg-neutral-700/60 hover:-translate-y-px active:translate-y-0 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-500 dark:focus-visible:ring-neutral-400"
            >
              Tema
            </button>
          </div>

          <div class="mt-8 pt-6 border-t border-neutral-200 dark:border-neutral-800">
            <div
              class="text-xs font-semibold text-neutral-500 dark:text-neutral-400 uppercase tracking-wide"
            >
              Redes Sociais
            </div>
            <div class="mt-2 space-y-1 text-sm">
              <a
                href="https://github.com/julianvitor"
                target="_blank"
                rel="noreferrer"
                class="block rounded-md px-2 py-2 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/40"
                >GitHub</a
              >
              <a
                href="https://www.linkedin.com/in/julian-carreiro/"
                target="_blank"
                rel="noreferrer"
                class="block rounded-md px-2 py-2 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/40"
                >LinkedIn</a
              >
            </div>
          </div>
        </div>
      </aside>

      <!-- Conteúdo da Ferramenta -->
      <main class="flex-1 lg:ml-56">
        <div class="max-w-4xl mx-auto px-4 md:px-10 py-12 md:py-20 space-y-8">
          
          <a
            href="../tools.html"
            class="inline-flex items-center text-sm text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white"
          >
            ← Voltar para Utilidades
          </a>

          <div>
            <span class="text-4xl">📱</span>
            <h1 class="mt-3 text-3xl md:text-4xl font-extrabold">
              Gerador de QR Code
            </h1>
            <p class="mt-2 text-neutral-600 dark:text-neutral-300 max-w-xl leading-relaxed">
              Crie QR codes instantâneos e customizados para sites, redes Wi-Fi, textos ou pagamentos. 100% executado no seu navegador.
            </p>
          </div>

          <section class="rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6 md:p-8 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
              
              <!-- Controles -->
              <div class="space-y-4">
                <div>
                  <label for="qr-text" class="block text-sm font-semibold mb-1 text-neutral-700 dark:text-neutral-300">
                    Conteúdo ou Link:
                  </label>
                  <textarea
                    id="qr-text"
                    rows="4"
                    class="w-full rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-950 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-500 font-mono"
                    placeholder="https://... ou qualquer texto"
                  >https://github.com/julianvitor</textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label for="qr-size" class="block text-xs font-semibold mb-1 text-neutral-600 dark:text-neutral-400">
                      Tamanho:
                    </label>
                    <select
                      id="qr-size"
                      class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-950 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-500"
                    >
                      <option value="160">Pequeno (160px)</option>
                      <option value="220" selected>Médio (220px)</option>
                      <option value="300">Grande (300px)</option>
                      <option value="420">HD (420px)</option>
                    </select>
                  </div>

                  <div>
                    <label for="qr-error" class="block text-xs font-semibold mb-1 text-neutral-600 dark:text-neutral-400">
                      Correção de Erro:
                    </label>
                    <select
                      id="qr-error"
                      class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-950 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-500"
                    >
                      <option value="L">L (7% de recuperação)</option>
                      <option value="M">M (15% de recuperação)</option>
                      <option value="Q">Q (25% de recuperação)</option>
                      <option value="H" selected>H (30% - Alta resiliência)</option>
                    </select>
                  </div>
                </div>

                <div class="flex flex-wrap gap-2 pt-3">
                  <button
                    id="qr-download-btn"
                    type="button"
                    class="inline-flex items-center gap-1.5 rounded-full bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 text-xs font-semibold px-5 py-2.5 hover:bg-neutral-800 dark:hover:bg-neutral-200 transition"
                  >
                    📥 Baixar Imagem PNG
                  </button>
                  <button
                    id="qr-copy-btn"
                    type="button"
                    class="inline-flex items-center gap-1.5 rounded-full border border-neutral-300 dark:border-neutral-700 text-xs font-medium px-4 py-2.5 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition"
                  >
                    📋 Copiar Imagem
                  </button>
                </div>
              </div>

              <!-- Preview -->
              <div class="flex flex-col items-center justify-center p-8 rounded-2xl bg-neutral-50 dark:bg-neutral-950 border border-neutral-200 dark:border-neutral-800 min-h-[300px]">
                <div id="qrcode-container" class="bg-white p-4 rounded-xl shadow-sm"></div>
                <div id="qr-status" class="mt-4 text-xs text-neutral-500 dark:text-neutral-400 text-center font-medium"></div>
              </div>
            </div>
          </section>

        </div>
      </main>
    </div>

    <script>
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const btn = document.getElementById("menuBtn");

      function openMenu() {
        sidebar.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");
      }

      function closeMenu() {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      }

      btn.addEventListener("click", openMenu);
      overlay.addEventListener("click", closeMenu);

      let qrcodeInstance = null;

      function generateQR() {
        const text = document.getElementById("qr-text").value.trim();
        const size = parseInt(document.getElementById("qr-size").value, 10);
        const levelCode = document.getElementById("qr-error").value;
        const container = document.getElementById("qrcode-container");
        const status = document.getElementById("qr-status");

        container.innerHTML = "";
        if (!text) {
          status.textContent = "Digite algum texto para gerar o QR Code.";
          return;
        }

        const correctLevels = {
          L: QRCode.CorrectLevel.L,
          M: QRCode.CorrectLevel.M,
          Q: QRCode.CorrectLevel.Q,
          H: QRCode.CorrectLevel.H,
        };

        qrcodeInstance = new QRCode(container, {
          text: text,
          width: size,
          height: size,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: correctLevels[levelCode] || QRCode.CorrectLevel.H,
        });

        status.textContent = `QR Code gerado (${size}x${size}px)`;
      }

      document.getElementById("qr-text").addEventListener("input", generateQR);
      document.getElementById("qr-size").addEventListener("change", generateQR);
      document.getElementById("qr-error").addEventListener("change", generateQR);

      document.getElementById("qr-download-btn").addEventListener("click", () => {
        const img = document.querySelector("#qrcode-container img");
        const canvas = document.querySelector("#qrcode-container canvas");
        let url = "";

        if (img && img.src && img.src.startsWith("data:")) {
          url = img.src;
        } else if (canvas) {
          url = canvas.toDataURL("image/png");
        }

        if (url) {
          const a = document.createElement("a");
          a.download = "qrcode.png";
          a.href = url;
          a.click();
        } else {
          alert("Gere o QR Code primeiro!");
        }
      });

      document.getElementById("qr-copy-btn").addEventListener("click", async () => {
        const canvas = document.querySelector("#qrcode-container canvas");
        if (!canvas) {
          alert("Gere o QR Code primeiro!");
          return;
        }
        try {
          canvas.toBlob(async (blob) => {
            await navigator.clipboard.write([
              new ClipboardItem({ "image/png": blob })
            ]);
            const status = document.getElementById("qr-status");
            status.textContent = "✅ Imagem copiada para a área de transferência!";
            setTimeout(() => { status.textContent = `QR Code pronto`; }, 3000);
          });
        } catch (err) {
          alert("Não foi possível copiar diretamente a imagem (restrição do navegador). Utilize o botão Baixar PNG!");
        }
      });

      // Inicializa
      generateQR();
    </script>
  </body>
</html>
